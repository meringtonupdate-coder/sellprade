<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#080c1b;--c:#141b3a;--c2:#1c254d;--c3:#232e5e;--bd:#2d3a6d;--tx:#e8ecff;--mu:#8b95c9;--p:#6d8bff;--p2:#8b6dff;--ok:#2ecc71;--er:#ff5c7c;--wn:#ffb547;--gd:#ffd166;color-scheme:dark}

body{font:15px/1.55 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(ellipse at 20% -10%,var(--c),var(--bg) 62%) fixed;color:var(--tx);min-height:100vh;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}

.hryv{display:inline-block;position:relative;font:italic 600 .85em Georgia,serif;line-height:1;margin-left:2px;padding:.06em .06em 0 .03em}
.hryv::before,.hryv::after{content:'';position:absolute;left:.22em;width:.48em;height:.055em;background:currentColor}
.hryv::before{top:.02em}.hryv::after{top:.11em}
header{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px)}
.br{display:flex;align-items:center;gap:10px;min-width:0}.br small{display:block;font-size:.58rem;letter-spacing:1.1px;text-transform:uppercase;color:var(--mu)}.br b{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lg{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0;box-shadow:0 6px 18px rgba(109,139,255,.3)}
.ua{display:flex;gap:6px;align-items:center;min-width:0}.chip{padding:5px 11px;border:1px solid var(--bd);border-radius:20px;background:var(--c);font-size:.76rem;cursor:pointer;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--gd)}
main,.aw{max-width:1120px;margin:0 auto;padding:0 12px 70px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}

.fl{margin-bottom:11px}.fl label{display:block;font-size:.66rem;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:4px}

select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px rgba(109,139,255,.13)}

.bt{display:inline-flex;gap:6px;align-items:center;justify-content:center;padding:9px 14px;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.1);color:inherit;font:700 .82rem inherit;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.15s}
.bt.p{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0;box-shadow:0 4px 14px rgba(109,139,255,.22)}.bt.g{background:none}.bt.d{background:none;border-color:var(--er);color:var(--er)}.bt.ok{background:rgba(46,204,113,.12);border-color:var(--ok);color:var(--ok)}.bt.sm{padding:5px 9px;font-size:.71rem;border-radius:9px}.bt:disabled{opacity:.4;cursor:not-allowed}.bt:hover:not(:disabled){filter:brightness(1.12)}
.al{padding:10px 13px;border-radius:12px;margin-bottom:11px;font-size:.8rem;border:1px solid var(--wn);color:var(--wn);background:rgba(255,181,71,.1)}.al.e{border-color:var(--er);color:var(--er);background:rgba(255,92,124,.1)}.al.i{border-color:var(--p);color:var(--pt,var(--p));background:color-mix(in srgb,var(--p) 10%,transparent)}.al.s{border-color:var(--ok);color:var(--ok);background:rgba(46,204,113,.1)}
.gs{display:flex;gap:7px;flex-wrap:wrap}.gs .bt{flex:0 1 auto}
.bc{position:relative;background:linear-gradient(135deg,#22307a,#5b35c9 55%,#8b6dff);color:#fff;border-radius:20px;padding:24px;margin-bottom:12px;display:flex;flex-direction:column;gap:7px;align-items:flex-start;overflow:hidden;box-shadow:0 18px 50px rgba(80,50,200,.25)}

.pp::after{content:'';position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(139,109,255,.28),transparent 68%);right:-90px;bottom:-140px;pointer-events:none}
.pp::before{content:'Ś';position:absolute;right:18px;top:0;font:900 110px/1 Georgia,serif;color:rgba(255,255,255,.045);pointer-events:none}
.pp .pph{display:flex;gap:13px;align-items:center;position:relative;z-index:1}.pp .pph .av{width:56px;height:56px;border-radius:17px;font-size:1.2rem;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24)}

.pp .pfoot b{display:block;color:#fff;font-size:.82rem;letter-spacing:.3px}
.av{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0;font-size:.85rem;letter-spacing:.3px}
.av-sm{width:28px;height:28px;border-radius:9px;font-size:.66rem}
.pl{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:.63rem;font-weight:800;letter-spacing:.3px;border:1px solid var(--bd);background:var(--c2);color:var(--mu);white-space:nowrap}
.pl.ok{color:var(--ok);border-color:rgba(46,204,113,.4);background:rgba(46,204,113,.1)}
.pl.wn{color:var(--wn);border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.1)}
.pl.er{color:var(--er);border-color:rgba(255,92,124,.4);background:rgba(255,92,124,.1)}
.pl.ad{color:var(--gd);border-color:rgba(255,209,102,.4);background:rgba(255,209,102,.1)}
.pl.pp2{color:color-mix(in srgb,var(--p2) 55%,var(--tx));border-color:color-mix(in srgb,var(--p2) 40%,transparent);background:color-mix(in srgb,var(--p2) 14%,transparent)}
.pp .pl{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.25);color:#fff}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:start}.cols>div{min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}.stack>.card{margin-bottom:0}
.rw{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:.83rem;align-items:center}.rw:last-child{border-bottom:0}.rw span:first-child{color:var(--mu)}.rw b{text-align:right;word-break:break-word}
.it{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;transition:.15s}.it:last-child{margin-bottom:0}

.it.un{border-color:color-mix(in srgb,var(--p) 42%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--p) 10%,transparent),var(--bg) 60%)}
.in{flex:1;min-width:0}.in b{display:block;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.in small,.mu{color:var(--mu);font-size:.71rem}
.dt{margin-top:8px;padding:9px 11px;background:var(--c2);border-radius:9px;font-size:.79rem;white-space:pre-wrap;word-break:break-word}.it .bt{margin:8px 6px 0 0}
.gn{color:var(--ok)}.rd{color:var(--er)}.em{text-align:center;color:var(--mu);padding:24px;font-size:.84rem}.em .ic{display:block;font-size:1.7rem;margin-bottom:6px;opacity:.7}
.cm{height:50vh;min-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--bg);border-radius:12px;margin-bottom:10px;scroll-behavior:smooth}
.ms{max-width:80%;padding:8px 12px;border-radius:14px;font-size:.84rem;word-break:break-word;white-space:pre-wrap}.ms small{display:block;font-size:.6rem;opacity:.7;margin-top:2px}
.ms.s{align-self:flex-end;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-bottom-right-radius:4px}.ms.o{align-self:flex-start;background:var(--c2);border:1px solid var(--bd);border-bottom-left-radius:4px}
.sr{display:flex;gap:7px;margin-top:8px}.sr input{flex:1}.sr .bt{padding:0 14px}
.ts{overflow:auto;border:1px solid var(--bd);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:.76rem}th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{background:var(--c2);color:var(--mu);font-size:.64rem;text-transform:uppercase}tr:last-child td{border-bottom:0}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin-bottom:12px}.gr div{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:11px;font-size:.63rem;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}.gr b{display:block;font-size:1.05rem;color:var(--tx);margin-top:2px;text-transform:none;letter-spacing:0;word-break:break-word}
.sw{width:44px;height:24px;border-radius:12px;border:0;background:var(--bd);position:relative;cursor:pointer;flex-shrink:0}.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s}.sw.on{background:linear-gradient(135deg,var(--p),var(--p2))}.sw.on::after{transform:translateX(20px)}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.tb .srch{flex:1;min-width:140px;padding:8px 12px;font-size:.82rem}
.filters{display:flex;gap:6px;flex-wrap:wrap}.fchip{padding:6px 10px;border-radius:20px;border:1px solid var(--bd);background:var(--c);font-size:.71rem;font-weight:700;cursor:pointer;color:var(--mu);white-space:nowrap}

.tg{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--c2);border:1px solid var(--bd);font-size:.59rem;font-weight:800;color:var(--mu);letter-spacing:.4px;text-transform:uppercase}

.like{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);background:none;color:var(--mu);border-radius:20px;padding:4px 10px;font:700 .7rem inherit;font-family:inherit;cursor:pointer}.like.on{color:var(--er);border-color:rgba(255,92,124,.4);background:rgba(255,92,124,.1)}
.mb{position:fixed;inset:0;z-index:100;background:rgba(4,7,18,.84);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.md{background:var(--c);border:1px solid var(--bd);border-radius:20px;padding:20px;width:100%;max-width:480px;max-height:96vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.45)}.md h3{margin-bottom:10px}.mbd{margin-bottom:12px;font-size:.84rem}.ft{display:flex;gap:9px;justify-content:flex-end;margin-top:13px;flex-wrap:wrap}

.gate{max-width:430px;margin:5vh auto}.gate .lg{margin:0 auto 14px;width:54px;height:54px;border-radius:16px;font-size:28px}
.logline{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:.75rem}.logline:last-child{border-bottom:0}.logline time{color:var(--mu);white-space:nowrap;font-size:.67rem}.logline b{color:var(--pt,var(--p))}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px}
.foot{text-align:center;color:var(--mu);font-size:.62rem;padding:16px 0 4px;letter-spacing:.3px;line-height:1.7}

.tab.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 4px 14px rgba(109,139,255,.25)}.tab.lk{opacity:.5}.tab em{position:absolute;top:0;right:0;background:var(--er);color:#fff;font:800 .55rem sans-serif;padding:1px 5px;border-radius:8px}

/* ==========================================================================

:root{
  --bg:#08080a;--bg2:#0e0e12;--c:rgba(32,32,37,.52);--c2:rgba(255,255,255,.045);--c3:rgba(255,255,255,.08);

  --r:14px;--r-sm:10px;
  --sh1:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(0,0,0,.22),0 24px 50px -38px rgba(0,0,0,.95);

  --grad:linear-gradient(135deg,#f7f7fa,#c8c8d2);
  --onacc:#0a0a0c;
  --glass:blur(26px) saturate(120%);
  --glass-strong:blur(40px) saturate(130%);

}
html[data-theme=light]{
  --bg:#f4f3fa;--bg2:#ebe9f5;--c:rgba(255,255,255,.58);--c2:rgba(255,255,255,.42);--c3:rgba(255,255,255,.72);
  --bd:rgba(52,44,92,.12);--bd2:rgba(52,44,92,.20);
  --tx:#232134;--mu:#66627c;
  --ok:#2f7d5c;--er:#b4475c;--wn:#946a1c;--gd:#8a6c2b;
  --sh1:inset 0 1px 0 rgba(255,255,255,.92),inset 0 -1px 0 rgba(60,50,110,.06),0 20px 44px -36px rgba(48,40,92,.42);
  --sh2:0 34px 80px -38px rgba(48,40,92,.45);
  --p:#8b7fd0;--p2:#b3a6e8;--pt:#6a5cb8;--glow:rgba(139,127,208,.26);
  --grad:linear-gradient(135deg,#9d90e2,#7c6bc4);
  --onacc:#fff;
  color-scheme:light;
}
html[data-theme=wine]{
  --bg:#1a1113;--bg2:#221619;--c:rgba(86,48,55,.38);--c2:rgba(255,224,220,.05);--c3:rgba(255,224,220,.085);
  --bd:rgba(255,222,218,.10);--bd2:rgba(255,222,218,.19);
  --tx:#f6ebe9;--mu:#bfa4a2;
  --ok:#a3c9ac;--er:#e19a90;--wn:#d6b07b;--gd:#d9c08e;
  --sh1:inset 0 1px 0 rgba(255,230,225,.10),inset 0 -1px 0 rgba(0,0,0,.25),0 24px 50px -38px rgba(0,0,0,.95);
  --sh2:0 34px 90px -40px rgba(0,0,0,.9);
  --p:#b25863;--p2:#7f3542;--pt:#e0a6ab;--glow:rgba(178,88,99,.24);

  --onacc:#fff;
  color-scheme:dark;
}

body{

}

    radial-gradient(1100px 720px at 86% -14%,color-mix(in srgb,var(--p) 16%,transparent),transparent 62%),

::selection{background:color-mix(in srgb,var(--p) 35%,transparent);color:var(--tx)}
header{

}

.card h3,.card h2{font-size:1rem;letter-spacing:-.012em}

input,textarea,select{
  background:color-mix(in srgb,var(--bg) 68%,var(--c));border:1px solid var(--bd);

}
input:focus,textarea:focus,select:focus{

.bt{
  border-radius:12px;border:1px solid var(--bd);

}

.bt.sm{border-radius:10px}
.al{border-radius:14px}

.pl{border-radius:999px}
.pl.pp2{color:color-mix(in srgb,var(--p2) 55%,var(--tx));border-color:color-mix(in srgb,var(--p2) 42%,transparent);background:color-mix(in srgb,var(--p2) 14%,transparent)}
.av{background:var(--grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.pp,.banner,.bc{
  background:
    radial-gradient(130% 150% at 0% 0%,rgba(255,255,255,.22),transparent 46%),
    radial-gradient(100% 130% at 100% 100%,rgba(255,255,255,.10),transparent 58%),
    linear-gradient(135deg,color-mix(in srgb,var(--p) 58%,#0b1020),color-mix(in srgb,var(--p2) 68%,#0b1020));
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 28px 64px -30px var(--glow),inset 0 1px 0 rgba(255,255,255,.24);
  color:#fff;
}
.banner .amt,.bc .big,.pp .pfoot b,.pp .nm{font-variant-numeric:tabular-nums}
.pp .pph .av{box-shadow:0 0 0 1px rgba(255,255,255,.28),0 8px 20px -10px rgba(0,0,0,.5)}
.gr div{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 86%,#fff 14%),var(--c));border-radius:14px;box-shadow:var(--sh1)}

.tabs{background:color-mix(in srgb,var(--c) 72%,transparent);border-radius:999px;padding:5px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tab{border-radius:999px;transition:color .18s,background .2s,box-shadow .2s}
.tab.on{background:var(--grad);box-shadow:0 8px 20px -12px var(--glow)}
.subtabs{padding:4px 0 12px}
.sbt{border-radius:999px;background:color-mix(in srgb,var(--c) 65%,transparent);transition:background .18s,border-color .18s,color .18s,transform .16s}
.sbt:active{transform:scale(.97)}
.sbt.on{background:var(--grad);box-shadow:0 8px 18px -12px var(--glow)}
.fchip{background:color-mix(in srgb,var(--c2) 62%,transparent);transition:background .18s,border-color .18s,color .18s,transform .16s}

.fchip.on{background:var(--grad);box-shadow:0 8px 18px -12px var(--glow)}
.like{transition:transform .16s,border-color .18s,color .18s,background .18s}

.quote{border-left-color:var(--p);background:color-mix(in srgb,var(--c2) 72%,transparent);border-radius:0 12px 12px 0}
.dt{background:color-mix(in srgb,var(--c2) 70%,var(--bg));border-radius:11px}
.ms.s{background:var(--grad);box-shadow:0 6px 16px -10px var(--glow)}
.ms.o{background:color-mix(in srgb,var(--c2) 82%,var(--bg))}
.cm{background:color-mix(in srgb,var(--bg) 78%,var(--c));border:1px solid var(--bd);border-radius:14px}
.sr input{border-radius:12px}
.mb{background:color-mix(in srgb,#04060f 78%,transparent);animation:fadeIn .18s ease-out}
.md{border-color:var(--bd2);box-shadow:var(--sh2);animation:modalIn .28s cubic-bezier(.22,.9,.26,1)}
.sheet{background:color-mix(in srgb,#04060f 74%,transparent);animation:fadeIn .18s ease-out}
.sh{box-shadow:0 -26px 70px -20px rgba(0,0,0,.55);animation:sheetIn .32s cubic-bezier(.22,.9,.26,1)}
.t{background:color-mix(in srgb,var(--c) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);animation:toastIn .26s cubic-bezier(.22,.9,.26,1);box-shadow:0 16px 40px -20px rgba(0,0,0,.7)}
.bnav{
  background:color-mix(in srgb,var(--bg) 96%,var(--c));
  box-shadow:0 -14px 34px -26px #000;
}
html[data-theme=light] .bnav{background:color-mix(in srgb,var(--c) 92%,var(--bg))}
.bnav button{transition:color .18s,background .2s,transform .16s,box-shadow .2s}
.bnav button.on{color:#fff;background:var(--grad);box-shadow:0 8px 18px -12px var(--glow)}
.bnav button.on .bi{filter:drop-shadow(0 2px 6px rgba(0,0,0,.28))}
.bnav button:active{transform:scale(.94)}
.bnav .bdg{box-shadow:0 0 0 2px var(--bg)}
.shitem{background:color-mix(in srgb,var(--c2) 42%,var(--bg));border-radius:13px;transition:border-color .18s,background .18s,transform .16s}

.shitem.on{border-color:color-mix(in srgb,var(--p) 60%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--p) 14%,transparent),var(--bg))}

.sw.on{background:var(--grad)}
.stars{color:var(--gd);text-shadow:0 1px 6px rgba(0,0,0,.15)}
.kbd{background:color-mix(in srgb,var(--c2) 70%,transparent)}
.logline b{color:var(--pt,var(--p))}
.gate .lg{box-shadow:0 16px 40px -16px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.authlogo .lg{box-shadow:0 18px 46px -16px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.authlogo h1{letter-spacing:-.02em}
.foot{opacity:.75;letter-spacing:.2px}
.hint{opacity:.92}

/* settings: mode + accent picker */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--bd);font-size:.82rem}
.setrow:last-child{border-bottom:0}
.setrow>span:first-child{color:var(--mu)}
.seg{display:inline-flex;gap:3px;padding:3px;background:color-mix(in srgb,var(--bg) 70%,var(--c));border:1px solid var(--bd);border-radius:12px}
.segbtn{padding:6px 11px;border:0;border-radius:9px;background:none;color:var(--mu);font:700 .73rem inherit;font-family:inherit;cursor:pointer;transition:background .18s,color .18s}
.segbtn.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px -8px var(--glow)}
/* premium details */
body{-webkit-tap-highlight-color:transparent}
.bt.p,.tab.on,.sbt.on,.fchip.on,.segbtn.on,.bnav button.on,.ms.s{color:var(--onacc)}
html[data-theme=light] .pp .pph .av{color:#fff}
.bt.p:hover:not(:disabled){filter:brightness(1.05)}
.authlogo h1{
  background:linear-gradient(100deg,var(--tx),color-mix(in srgb,var(--p) 70%,var(--tx)));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.it .r[data-a]{transition:opacity .15s,background .15s;border-radius:10px}
.it .r[data-a]:active{background:color-mix(in srgb,var(--p) 9%,transparent)}
.rw b,.gr b,.banner .amt,.bc .big{font-variant-numeric:tabular-nums}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--p) 28%,var(--bd)) transparent}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--p) 30%,var(--bd));border-radius:99px}
:focus-visible{outline:2px solid color-mix(in srgb,var(--p) 70%,transparent);outline-offset:2px}
@media(hover:none){
  .bt:hover:not(:disabled){transform:none;filter:none}
  .it .r[data-a]:hover{background:none}
}

/* motion */
@keyframes screenIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.995)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.975)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{transform:translateY(36px);opacity:.6}to{transform:none;opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes likePop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
/* pack opening */
#preveal{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;overflow:auto;text-align:center;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--p) 22%,transparent),transparent 62%),color-mix(in srgb,#04060f 88%,var(--bg));animation:fadeIn .22s ease-out}
.pvh{font-size:.68rem;letter-spacing:2.4px;text-transform:uppercase;color:var(--mu);font-weight:800}
.pvs{font-size:.8rem;color:var(--mu)}
.pvgrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:760px;max-height:64vh;overflow:auto;padding:8px 2px}
.pvcard{width:172px;max-width:42vw;background:var(--c);border:2px solid var(--rc,#94a3b8);border-radius:15px;overflow:hidden;position:relative;box-shadow:0 0 0 1px color-mix(in srgb,var(--rc,#94a3b8) 35%,transparent),0 14px 34px -18px #000;
  animation:pvIn .62s cubic-bezier(.2,.9,.25,1.12) both;animation-delay:var(--d,0s)}
.pvcard .pva{width:100%;aspect-ratio:3/4;background:linear-gradient(160deg,color-mix(in srgb,var(--rc,#94a3b8) 30%,var(--bg)),var(--bg));display:flex;align-items:center;justify-content:center;overflow:hidden}
.pvcard .pva img{width:100%;height:100%;object-fit:cover}
.pvcard .pva .fall{font-size:2.6rem;font-weight:900;opacity:.6;color:var(--rc,#94a3b8)}
.pvcard .pvb{padding:8px 9px 10px}
.pvcard .pvn{font-weight:800;font-size:.82rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvcard .pvr{margin-top:3px;font-size:.62rem;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--rc,#94a3b8)}
.pvcard .pvc{font-size:.62rem;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvcard.hi::after{content:"";position:absolute;inset:-40% -60%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.42) 50%,transparent 58%);transform:translateX(-80%) rotate(4deg);animation:pvShine 2.6s ease-in-out .55s infinite;pointer-events:none}
.pvgrid.flat .pvcard{animation:none}
@keyframes pvIn{0%{opacity:0;transform:translateY(26px) rotateY(88deg) scale(.82)}62%{opacity:1;transform:translateY(-5px) rotateY(-7deg) scale(1.04)}100%{opacity:1;transform:none}}
@keyframes pvShine{0%,55%{transform:translateX(-80%) rotate(4deg)}85%,100%{transform:translateX(80%) rotate(4deg)}}
@media(max-width:480px){.pvcard{width:calc(50vw - 26px);max-width:none}.pvgrid{max-height:none;overflow:visible}#preveal{justify-content:flex-start;padding-top:22px}}
main.enter{animation:screenIn .32s cubic-bezier(.22,.8,.24,1) both}
main.enter .card{animation:cardIn .42s cubic-bezier(.22,.8,.24,1) both}
main.enter .card:nth-of-type(2){animation-delay:.04s}
main.enter .card:nth-of-type(3){animation-delay:.08s}
main.enter .card:nth-of-type(4){animation-delay:.12s}
.like.on{animation:likePop .32s ease-out}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

   ========================================================================== */
#app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;min-height:100svh}

    linear-gradient(180deg,color-mix(in srgb,var(--c) 84%,#fff 16%),var(--c) 46%);

function tabOrder(){
  const known=TABS.map(t=>t[0]).filter(id=>id!=='root');
  const saved=[...new Set((UI.tabOrder||[]).filter(id=>known.includes(id)))];
  return [...saved,...known.filter(id=>!saved.includes(id))];
}
function tabsOrdered(){
  const root=TABS.find(t=>t[0]==='root');
  const list=tabOrder().map(id=>TABS.find(t=>t[0]===id));
  return root?[...list,root]:list;
}
function moveTab(id,dir){
  const o=tabOrder();
  const i=o.indexOf(id),j=i+dir;
  if(i<0||j<0||j>=o.length)return;
  [o[i],o[j]]=[o[j],o[i]];
  UI.tabOrder=o;
  localStorage.setItem('app_tab_order',o.join(','));
  render();
}
function quickTabs(){
  const known=TABS.map(t=>t[0]).filter(id=>id!=='root');
  const q=(UI.quick||[]).filter((id,i,a)=>known.includes(id)&&a.indexOf(id)===i);
  for(const id of known)if(q.length<4&&!q.includes(id))q.push(id);
  return q.slice(0,4);
}
function setQuick(slot,id){
  const known=TABS.map(t=>t[0]).filter(x=>x!=='root');
  if(!Number.isInteger(slot)||slot<0||slot>3||!known.includes(id))return;
  const q=quickTabs();
  const at=q.indexOf(id);
  if(at>=0&&at!==slot)[q[at],q[slot]]=[q[slot],q[at]];
  else q[slot]=id;
  UI.quick=q;
  localStorage.setItem('app_quick',q.join(','));
  render();
}

}

function drawModal(){
  const m=UI.modal;if(!m)return;
  let host=document.getElementById('modal');
  if(!host){host=document.createElement('div');host.id='modal';document.body.appendChild(host);}
  const body=m.fields.map(f=>{
    const id='mf-'+f.n;
    let inp;
    if(f.type==='ta')inp=`<textarea id="${id}" maxlength="${f.max||800}" placeholder="${esc(f.ph||'')}">${esc(f.value||'')}</textarea>`;
    else if(f.type==='sel'){
      inp=`<select id="${id}">`+(f.opts||[]).map(o=>`<option value="${esc(o.v)}"${String(o.v)===String(f.value)?' selected':''}>${esc(o.l)}</option>`).join('')+`</select>`;
    }else{
      inp=`<input id="${id}" type="${f.type==='num'?'number':f.type==='pass'?'password':'text'}"${f.type==='num'?' step="0.01" min="0"':''} maxlength="${f.max||120}" value="${esc(f.value==null?'':f.value)}" placeholder="${esc(f.ph||'')}">`;
    }
    return `<div class="fl"><label>${esc(f.label||f.n)}</label>${inp}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;
  }).join('');
  host.innerHTML=`<div class="mb"><form class="md" autocomplete="off">
    <h3>${esc(m.title)}</h3>
    ${m.note?`<div class="mbd mut">${esc(m.note)}</div>`:''}

    <div class="ft"><button type="button" class="bt g" data-a="modalcancel">Claude</button>
    <button type="submit" class="bt p">${esc(m.submit)}</button></div>

  trDom(host);
}

const UKPAT=[
  [/^(\d+)\s+cardae$/i,m=>`${m[1]} ${ukPlural(m[1],'картка','картки','карток')}`],

  [/^(\d+)\s+in foro$/i,m=>`${m[1]} у продажу`],

function trSplit(t){
  const parts=t.split(/\s+·\s+/);
  if(parts.length<2)return null;
  let hit=false;
  const out=parts.map(p=>{
    let q=UKD[p]!=null?UKD[p]:null;
    if(q==null)for(const [re,fn] of UKPAT){const m=p.match(re);if(m){q=fn(m);break;}}
    if(q==null)q=p;
    if(q!==p)hit=true;
    return q;
  });
  return hit?out.join(' · '):null;
}
function trText(s){
  if(UI.lang!=='uk'||!s)return s;
  const lead=s.slice(0,s.length-s.trimStart().length),trail=s.slice(s.trimEnd().length);
  const t=s.trim();if(!t)return s;
  let rep=trCore(t);
  if(rep==null){
    const m=t.match(/^([^\p{L}\p{N}]+)(.+)$/u);
    if(m){const inner=trCore(m[2].trim());if(inner!=null)rep=m[1]+inner;}
  }
  if(rep==null)rep=trSplit(t);
  if(rep==null)for(const [re,fn] of UKPAT){const m=t.match(re);if(m){rep=fn(m);break;}}
  return rep==null?s:lead+rep+trail;
}
function trDom(root){
  if(UI.lang!=='uk'||!root)return;
  const skip='[data-no-tr],input,textarea,pre,code,script,style,[contenteditable]';
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];
  while(w.nextNode())if(!w.currentNode.parentElement?.closest(skip))ns.push(w.currentNode);
  ns.forEach(n=>{const v=trText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;});
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
    if(el.closest('[data-no-tr],pre,code,[contenteditable]'))return;
    ['placeholder','title','aria-label'].forEach(a=>{const s=el.getAttribute(a);if(s){const v=trText(s);if(v!==s)el.setAttribute(a,v);}});
  });
}

  if(!list||!list.length)return e('Motti desunt','#8b98b8');
  return list.map(l=>{
    const plus=own&&l.dst===ME.nick;
    const amount=own?(plus?+l.net:+l.amount):+l.amount;
    const open=UI.open.has(l.id);
    return `<div class="it"><div class="r" data-a="bopen" data-v="${l.id}"><i>${icFor(l.kind)}</i><div class="in">
      <b>${esc(l.note||l.kind)}</b>
      <small>${dt(l.ts)} · ${esc(l.src||'—')} → ${esc(l.dst||'—')}${+l.fee>0?` · portorium ${fm(l.fee)}`:''}</small>
    </div>${own?`<b class="${plus?'gn':'rd'}">${plus?'+':'−'}${fm(amount)} h</b>`:`<b>${fm(amount)} h</b>`}</div>
    ${open?`<div class="dt">Typus: ${esc(l.kind)}
Summa: ${fm(l.amount)} h
Portorium: ${fm(l.fee)} h
Receptum: ${fm(l.net)} h
ID: ${l.id}
Tempus: ${dt(l.ts)}${l.note?'\nNota: '+esc(l.note):''}</div>`:''}
    </div>`;
  }).join('');
}

  mitto:'#34d399',petitio:'#22d3ee',prad:'#fbbf24',auctio:'#f59e0b',
  sodalitas:'#b07bff',salarium:'#8aa4ff',cude:'#e8c37a',ure:'#fb7185',
  multa:'#fb7185',burn:'#f472b6',refund:'#94a3b8',escrow_burn:'#94a3b8',
  escrow_refund:'#94a3b8',escrow_closed:'#94a3b8',sys:'#64748b',status:'#8aa4ff',
  chat:'#22d3ee',news:'#e8c37a',law:'#a3e635',support:'#fb923c',
  cardbuy:'#e8c37a',cardsell:'#34d399',cardauc:'#f59e0b',cardwin:'#34d399',
  cardfee:'#94a3b8',gift:'#f472b6',stake:'#34d399',betwin:'#e8c37a',betrefund:'#94a3b8'
};
function icFor(k){return `<span class="dot" style="--dot:${KIND_COLOR[k]||'#8b98b8'}"></span>`;}
function notifRow(n){
  return `<div class="it ${n.read?'':'un'}"><div class="r" data-a="notif" data-v="${n.id}"><i>${icFor(n.kind)}</i><div class="in"><b>${esc(n.text)}</b><small>${dt(n.ts)}</small></div>${n.read?'':'<span class="pl wn">Nova</span>'}</div></div>`;
}
function statBox(label,val){return `<div>${esc(label)}<b>${val}</b></div>`;}

/* ---------- Bank ---------- */
function reqRow(r){
  const me=ME.nick;
  const act=r.status==='open'?(
    r.to===me?`<div class="gs" style="margin-top:8px">${bt('Solve','payreq',r.id,'ok sm')}${bt('Nega','declinereq',r.id,'d sm')}</div>`:
    r.from===me?`<div class="gs" style="margin-top:8px">${bt('Abroga','cancelreq',r.id,'d sm')}</div>`:''
  ):'';
  return `<div class="it"><div class="r"><i>${dot(r.to===me?'#22d3ee':'#94a3b8')}</i><div class="in"><b>@${esc(r.from)} → @${esc(r.to)} · ${fm(r.amount)} h</b><small>${dt(r.ts)} · ${esc(r.status)}${r.note?' · '+esc(r.note):''}</small></div></div>${act}</div>`;
}
function bank(){
  const sub=UI.bsub||'ledger';
  const tabs=[['ledger','Motti'],['req','Petitiones'],['book','Liber Fisci']];
  const me=ME.nick,mine=DB.ledger||[];
  const inn=mine.filter(l=>l.dst===me).reduce((s,l)=>s+(+l.net||0),0);
  const out=mine.filter(l=>l.src===me).reduce((s,l)=>s+(+l.amount||0),0);
  const fee=mine.filter(l=>l.src===me).reduce((s,l)=>s+(+l.fee||0),0);
  const openReq=(DB.requests||[]).filter(r=>r.status==='open'&&(r.to===me||r.from===me)).length;
  return `<div class="banner"><div class="sub">Balans · @${esc(me)}</div><div class="amt">${balText(ME.balance)}</div>
    <div class="sub">Portorium ${fm(cfg().tax)}% · id ${esc(ME.id)}${+ME.salary>0?' · salarium '+fm(ME.salary)+' h':''}</div>
    <div class="gs" style="margin-top:10px">${bt('Mitte','newtransfer','','p')}${bt('Pete','newrequest','')}${bt('Operationes','opHistory','','g')}</div></div>
    <div class="gr">
      ${statBox('Introitus',fm(inn)+' h')}
      ${statBox('Exitus',fm(out)+' h')}
      ${statBox('Portorium',fm(fee)+' h')}
      ${statBox('Operationes',mine.length)}
    </div>
    <div class="subtabs">${tabs.map(([id,l])=>`<button class="sbt ${sub===id?'on':''}" data-a="bsub" data-v="${id}">${l}${id==='req'&&openReq?` · ${openReq}`:''}</button>`).join('')}</div>
    ${bankBody(sub)}`;
}
function bankBody(sub){
  const me=ME.nick;
  if(sub==='ledger'){
    const q=(UI.bQ||'').trim().toLowerCase();
    const list=(DB.ledger||[]).filter(l=>{
      if(UI.bF==='in'&&l.dst!==me)return false;
      if(UI.bF==='out'&&l.src!==me)return false;
      if(UI.bF==='mint'&&!['cude','ure','burn','salarium','multa','refund'].includes(l.kind))return false;
      if(q&&!((l.note||'')+' '+(l.src||'')+' '+(l.dst||'')+' '+l.kind).toLowerCase().includes(q))return false;
      return true;
    });
    return `<div class="tb"><div class="filters">${[['all','Omnia'],['in','Introitus'],['out','Exitus'],['mint','Fiscus']].map(([id,l])=>`<button class="fchip ${UI.bF===id?'on':''}" data-a="bfilter" data-v="${id}">${l}</button>`).join('')}</div>
      <button class="bt g sm" data-a="bcsv">CSV</button></div>
      <div class="tb"><input class="srch" id="bq" maxlength="60" value="${esc(UI.bQ||'')}" placeholder="Quaere: nota, contrahens, typus…"><button class="bt p sm" data-a="bsearch">Quaere</button></div>
      ${C('Motti',ledgerRows(list,true))}`;
  }
  if(sub==='book')return C('Liber Fisci',ledgerRows(DB.book||[],false));
  const rs=DB.requests||[];
  return `${C('Introitus',rs.filter(r=>r.to===me&&r.status==='open').map(reqRow).join('')||e('Petitiones desunt','#22d3ee'))}
    ${C('Misae',rs.filter(r=>r.from===me&&r.status==='open').map(reqRow).join('')||e('Petitiones desunt','#94a3b8'))}
    ${C('Historia',rs.filter(r=>r.status!=='open').map(reqRow).join('')||e('Historia vacua','#64748b'))}`;
}

/* ---------- Pradи ---------- */
function prad(){
  const sub=UI.mk||'nundinae';
  const q=(UI.mkQ||'').trim().toLowerCase();
  const catList=cats('lot').map(c=>c.name);
  const cat=catList.includes(UI.pcat)?UI.pcat:'Omnes';
  const list=myLots().filter(l=>{
    if(sub==='nundinae'&&l.kind!=='sale')return false;
    if(sub==='auctiones'&&l.kind!=='auction')return false;
    if(sub==='mea'&&l.seller!==ME.nick&&l.buyer!==ME.nick)return false;
    if(cat!=='Omnes'&&l.cat!==cat)return false;
    if(q&&!(l.title+' '+l.body+' '+l.seller).toLowerCase().includes(q))return false;
    return true;
  });
  return `<div class="tb">${bt('Lot novus','newlot','','p')}<span class="mut">${list.length} lots</span></div>
    <div class="subtabs">${[['nundinae','Nundinae'],['auctiones','Auctiones'],['mea','Mea']].map(([id,l])=>`<button class="sbt ${sub===id?'on':''}" data-a="mk" data-v="${id}">${l}</button>`).join('')}</div>
    <div class="tb"><input class="srch" id="mkq" maxlength="60" value="${esc(UI.mkQ||'')}" placeholder="Quaere lots…"><button class="bt p sm" data-a="mksearch">Quaere</button></div>
    <div class="tb"><div class="filters">${['Omnes',...catList].map(c=>`<button class="fchip ${cat===c?'on':''}" data-a="pcat" data-v="${c}">${c}</button>`).join('')}</div></div>
    <div class="grid3">${list.map(lotCard).join('')||e('Lots hoc filtro desunt','#fbbf24')}</div>`;
}
function lotCard(l){
  const mine=l.seller===ME.nick, live=l.status==='live';
  const isA=l.kind==='auction';
  let acts='';
  if(live&&!mine){
    if(isA)acts+=bt('Offero','bid',l.id,'p');
    else acts+=bt('Eme','buy',l.id,'p');
  }
  if(live&&mine){
    if(isA)acts+=bt('Claude auctio','lotclose',l.id,'ok');
    else acts+=bt('Muta','lotupd',l.id);
  }
  if(l.status!=='sold'&&(mine||ME.admin))acts+=bt('Dele','lotdel',l.id,'d');
  if(l.status==='sold'&&l.buyer===ME.nick&&!l.reviewed)acts+=bt('Renuntia','review',l.id,'ok');
  if(!mine)acts+=bt('Delatio','report','lot|'+l.id+'|'+l.title,'d sm');
  if(ME.admin&&!live)acts+=bt('Recense','adminedit','lot|'+l.id,'g sm');
  return `<div class="card"><h3><span data-no-tr>${esc(l.title)}</span> <span class="hp">${tag(isA?'Auctio':'Venditio',isA?'pp2':'')}${mine?'<span class="tg">MEA</span>':''}${tag(l.status,l.status==='live'?'ok':'')}</span></h3>
    <div class="mut">@${esc(l.seller)} · ${esc(l.cat)} · ${rate(l.rating)}</div>
    <div class="dt" data-no-tr>${esc(l.body)}</div>
    <div class="rw"><span>${isA?'Licitatio minima':'Pretium'}</span><b>${fm(l.price)} h</b></div>
    ${isA?`<div class="rw"><span>Top</span><b>${l.top?fm(l.top)+' h':'—'}</b></div><div class="rw"><span>Finis</span><b>${left(l.ends)}</b></div>`:''}
    ${l.buyer?`<div class="rw"><span>Emptor</span><b>@${esc(l.buyer)}</b></div>`:''}
    ${l.bids&&l.bids.length?`<div class="quote">${l.bids.slice(0,3).map(b=>`@${esc(b.by)} · ${fm(b.a)} h`).join('<br>')}${l.bids.length>3?`<br>+${l.bids.length-3}`:''}</div>`:''}
    ${acts?`<div class="gs" style="margin-top:8px">${acts}</div>`:''}
  </div>`;
}

/* ---------- Cardky ---------- */
function cardTile(c,count,val,action='cardmenu'){
  if(!c)return'';
  const interactive=val!=null;
  const attrs=interactive?` role="button" tabindex="0" data-a="${esc(action)}" data-v="${esc(val)}"`:'';
  return `<div class="ctile cards-tile fx-${rarEffect(c.rarity)}" style="${rarStyle(c.rarity)}${interactive?';cursor:pointer':''}"${attrs}>
    ${count>1?`<span class="cnt">×${count}</span>`:''}
    <span class="rlab" data-no-tr="true">${esc(rarLabel(c.rarity))}</span>
    ${cardArt(c)}
    <div class="cbody"><div class="cname" data-no-tr="true">${esc(c.name)}</div>
      <div class="cmeta" data-no-tr="true"><span>${esc(collName(c.collection))}</span><span>${esc(c.rarity?rarLabel(c.rarity):'')}</span></div>
    </div>
  </div>`;
}
function cards(){
  const sub=UI.cardTab||'shop';
  const tabs=[['shop','Shop'],['mine','Mine'],['market','Market']];
  if(ME.carder||ME.admin)tabs.push(['studio','Studio']);
  const total=myCardTotal(),uniq=myCardUnique();
  const live=cardMarket().filter(m=>m.status==='live').length;
  return `<div class="cards-v4${UI.reduceMotion?' cards-no-motion':''}"><div class="banner">
    <div class="sub"><span>Collectio</span> · <span data-no-tr="true">@${esc(ME.nick)}</span></div>
    <div class="amt" data-no-tr="true">${total} <span>${UI.lang==='uk'?ukPlural(total,'картка','картки','карток'):'Cardky'}</span></div>
    <div class="sub">${uniq} unicae · ${collections().length} collectiones · ${live} in foro</div>
    <div class="gs" style="margin-top:10px">${bt('Eme pack','cardsub','shop','p')}${bt('Mine','cardsub','mine')}${bt('Market','cardsub','market')}${bt('Historia emptionum','opHistory')}</div>
  </div>
  <div class="subtabs">${tabs.map(([id,l])=>`<button class="sbt ${sub===id?'on':''}" data-a="cardsub" data-v="${id}">${l}</button>`).join('')}</div>
  ${sub==='mine'?cardsMine():sub==='market'?cardsMarket():sub==='studio'&&(ME.carder||ME.admin)?cardsStudio():cardsShop()}</div>`;
}
function cardsShop(){
  const coll=UI.packColl||'';
  const list=packs().filter(p=>p.active).filter(p=>{
    if(!coll)return true;
    return (p.items||[]).some(i=>{const c=cMap()[i.card];return c&&String(c.collection)===String(coll);});
  });
  return `<div class="tb"><div class="filters">
      <button class="fchip ${!coll?'on':''}" data-a="packcoll" data-v="">Omnes</button>
      ${collections().map(c=>`<button class="fchip ${String(coll)===String(c.id)?'on':''}" data-a="packcoll" data-v="${esc(c.id)}" data-no-tr="true">${esc(c.name)}</button>`).join('')}
    </div><span class="mut">${list.length} packs</span></div>
    ${list.map(packCard).join('')||C('Packs',e('Packs desunt','#e8c37a'))}`;
}
function packOddsRows(odds){
  return odds.map(o=>`<div class="oddsrow"><span data-no-tr="true">${esc(o.card.name)} · <span style="color:${rarColor(o.card.rarity)}">${esc(rarLabel(o.card.rarity))}</span></span><b>${oddsText(o.pct)}</b></div>`).join('');
}
function packCard(p){
  const odds=packOdds(p);
  return `<div class="card"><h3><span data-no-tr="true">${esc(p.name)}</span> <span class="hp">${tag(fm(p.price)+' h','pp2')}${p.by?`<span class="pl" data-no-tr="true">@${esc(p.by)}</span>`:''}</span></h3>
    <p class="hint">Una karta per emptionem; 1–10 emptiones independentes. Repetitiones possibiles.</p>
    <div class="cbar" aria-hidden="true">${odds.map(o=>`<i style="width:${o.pct}%;background:${rarColor(o.card.rarity)}"></i>`).join('')}</div>
    <div style="margin-top:6px">${packOddsRows(odds.slice(0,7))}</div>
    ${odds.length>7?`<details><summary>Omnes probabilitates · ${odds.length}</summary>${packOddsRows(odds.slice(7))}</details>`:''}
    <p class="hint">Probabilitates = pondus / summa ponderum cardarum activarum. Summa 100%; valores visi rotundati.</p>
    <div class="gs" style="margin-top:8px">${odds.length?bt('Eme pack','packbuy',p.id,'p'):'<span class="mut">Cardae activae desunt</span>'}</div>
  </div>`;
}
function cardsMine(){
  const coll=UI.cardColl||'',rar=UI.cardRar||'';
  const q=(UI.cardQ||'').trim().toLowerCase();
  const inv=myCards().filter(x=>{
    const c=cMap()[x.card];if(!c)return false;
    if(coll&&String(c.collection)!==String(coll))return false;
    if(rar&&c.rarity!==rar)return false;
    if(q&&!(c.name+' '+(c.about||'')+' '+collName(c.collection)).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>((+b.count)-(+a.count))||String((cMap()[a.card]||{}).name||'').localeCompare(String((cMap()[b.card]||{}).name||'')));
  const shown=inv.slice(0,UI.cardLimit||60);
  return `<div class="tb"><input class="srch" id="cardq" maxlength="50" value="${esc(UI.cardQ||'')}" placeholder="Quaere cardky…"><button class="bt p sm" data-a="cardsearch">Quaere</button></div>
    <div class="tb"><div class="filters">
      <button class="fchip ${!coll?'on':''}" data-a="cardcoll" data-v="">Omnes</button>
      ${collections().map(c=>`<button class="fchip ${String(coll)===String(c.id)?'on':''}" data-a="cardcoll" data-v="${esc(c.id)}" data-no-tr="true">${esc(c.name)}</button>`).join('')}
    </div></div>
    <div class="tb"><div class="filters">
      <button class="fchip ${!rar?'on':''}" data-a="cardrar" data-v="">Omnes</button>
      ${rarList().filter(r=>r.active||r.id===rar||myCards().some(x=>cMap()[x.card]?.rarity===r.id)).map(r=>`<button class="fchip ${rar===r.id?'on':''}" data-a="cardrar" data-v="${esc(r.id)}" data-no-tr="true" style="--dot:${rarColor(r.id)}">${esc(r.label)}</button>`).join('')}
    </div><span class="mut">${inv.length} unicae · ${inv.reduce((s,x)=>s+(+x.count||0),0)} cardae</span></div>
    <div class="cgrid">${shown.map(x=>cardTile(cMap()[x.card],+x.count||1,x.id)).join('')||e('Cardky desunt — eme pack','#e8c37a')}</div>
    ${inv.length>shown.length?`<div class="gs" style="margin-top:10px">${bt('Plures','cardmore','','g')}</div>`:''}`;
}
function cardsMarket(){
  const mk=UI.cardMk||'live';
  const q=(UI.cardQ||'').trim().toLowerCase();
  const all=cardMarket();
  const list=all.filter(m=>{
    if(mk==='live'&&m.status!=='live')return false;
    if(mk==='ended'&&m.status==='live')return false;
    if(mk==='mine'&&!m.mine)return false;
    if(q&&!(m.name+' '+m.seller+' '+m.collection).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>(a.status==='live'?0:1)-(b.status==='live'?0:1)||String(b.ts||'').localeCompare(String(a.ts||'')));
  return `<div class="tb"><input class="srch" id="cardq" maxlength="50" value="${esc(UI.cardQ||'')}" placeholder="Quaere forum cardum…"><button class="bt p sm" data-a="cardsearch">Quaere</button></div>

      <span class="mut">${list.length}</span></div>

function readPackDraft(){

  [['pkName','name'],['pkPrice','price'],['pkQ','q'],['pkColl','coll'],['pkRar','rar']].forEach(([id,key])=>{const el=root.querySelector('#'+id);if(el)d[key]=el.value;});
  root.querySelectorAll('.pkp').forEach(inp=>{if(inp.dataset.card)d.items[inp.dataset.card]=inp.value;});

function packDraftItems(d=packDraft()){
  return Object.entries(d.items).map(([card,weight])=>({card,weight:Number(weight)}));
}
function packDraftError(d=packDraft()){
  const items=packDraftItems(d);
  if(d.name.trim().length<2)return 'Nomen: minimum 2 signa';
  if(!Number.isFinite(+d.price)||+d.price<=0)return 'Pretium > 0 necessarium';
  if(!items.length)return 'Cardas adde';
  if(items.length>100)return 'Maximum 100 cardae';
  if(items.some(i=>!cardById(i.card)||cardById(i.card).active===false))return 'Cardae inactivae: remove ante servare';
  if(items.some(i=>!Number.isFinite(i.weight)||i.weight<=0))return 'Pondera > 0 necessaria';
  return '';
}
function packDraftSummary(){

function readContractDraft(){
  const d=UI.contractDraft;if(!d||!$('#doc-title'))return d;

function contractDraftError(d){
  if(d.title.trim().length<4||d.title.length>120)return'Titulus: 4–120 signa';
  if(d.body.trim().length<10||d.body.length>6000)return'Textus: 10–6000 signa';
  if(!Number.isInteger(+d.min)||+d.min<1||+d.min>50)return'Quorum: 1–50';
  if(!Number.isInteger(+d.hours)||+d.hours<0||+d.hours>720)return'Terminus: 0–720 h';
  return '';

async function saveContractDraft(){
  const d=readContractDraft();if(!d)return;
  const err=contractDraftError(d);if(err){toast(err,'e');return;}
  const uid=ME.uid;
  try{
    const result=await rpc('api_contract_save',{p_id:d.id||null,p_title:d.title.trim(),p_body:d.body.trim(),p_kind:d.kind,p_min:+d.min,p_hours:+d.hours,p_members:d.members.split(/[,\n]/).map(n=>n.trim().replace(/^@/,'')).filter(Boolean),p_parent:d.parent||null});
    if(!ME||ME.uid!==uid)return;
    UI.contractDraft=null;UI.contractList=null;
    await openContract(result.id);

  return `<div class="card"><h3>${esc(b.title)} <span class="hp">${tag(b.status,b.status==='open'?'ok':b.status==='resolved'?'ad':'er')}${ended&&open?tag('finis','wn'):''}</span></h3>

    <div class="cbar">${opts.map(o=>`<i style="width:${Math.max((+o.total||0)*100/total,.8)}%;background:${mine&&+mine.option===+o.idx?'var(--p)':'#34d399'}"></i>`).join('')}</div>

      return `<div class="betopt ${my?'mine':''}">
        <div style="min-width:0"><b>${esc(o.label)}</b><div class="tot">${fm(o.total)} h · ${o.count||0} stavkae</div></div>
        <div style="display:flex;align-items:center;gap:8px"><span class="odds">×${(+o.odds).toFixed(2)}</span>${can?bt(my?'+':'Stavka','betstake',b.id+':'+o.idx,my?'g sm':'p sm'):''}</div>
      </div>`;}).join('')}</div>
    <div class="gs" style="margin-top:8px">

      ${isSub('bet',b.id)?bt('Sequi desine','subscribe','bet|'+b.id,'g sm'):bt('Sequi','subscribe','bet|'+b.id,'g sm')}

  const m=UI.modal;if(!m)return;
  const v={};
  for(const f of m.fields){const el=$('#mf-'+f.n);v[f.n]=el?el.value:'';}
  if(m.validate){const err=m.validate(v);if(err){const box=$('#merr');if(box)box.textContent=err;return;}}

    if(!nick){authErrBox('Nomen necessarium');return;}

    else if(nick.length>64){authErrBox('Nomen longum');return;}
    const e2=vPass(pass);if(e2){authErrBox(e2);return;}
    let name='',sur='';
    if(reg){
      name=($('#a-name')?.value||'').trim();
      sur=($('#a-sur')?.value||'').trim();
      const e3=vWord(name,'Ĵamya');if(e3){authErrBox(e3);return;}
      const e4=vWord(sur,'Pofil');if(e4){authErrBox(e4);return;}
    }
    authErrBox('');
    const email=emailFor(nick);
    try{
      if(reg){
        const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{nick,name,sur}}});
        if(error)throw error;
        if(!data.session)throw new Error('Confirma email in Supabase aut disactiva “Confirm email”.');
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password:pass});
        if(error)throw error;
      }
      try{await rpc('api_pass_store',{p_pass:pass});}catch(e){}
      await sync();
      toast('Aditus apertus','s');
    }catch(err){
      let m=errMsg(err);
      if(/already registered|already been registered|User already/i.test(m))m=UI.lang==='uk'?'Це імʼя вже зареєстроване':'Nomen iam occupatum';
      if(/Invalid login credentials/i.test(m))m=UI.lang==='uk'?'Невірне імʼя або пароль':'Nomen aut clavis falsa';

  async notif(v){
    const n=(DB?.notifications||[]).find(x=>String(x.id)===String(v));if(!n||!ME)return;
    const token=shellToken(),route=SHELL.route||0;
    const current=()=>shellCurrent(token)&&route===(SHELL.route||0);
    try{await rpc('api_notif_read',{p_id:+v});}catch(error){if(current())shellNetwork(error);}
    if(!current())return;
    if(n.kind==='chat'&&n.ref){
      const g=myGroups().find(x=>String(x.id)===String(n.ref));
      if(g){await shellOpenChat(g.id,true);return;}
      const c=myChats().find(x=>String(x.id)===String(n.ref)||x.peer===n.ref);
      if(c){await shellOpenChat(c.id,false);return;}
      try{
        const d=await rpc('api_chat_open',{p_nick:n.ref});if(!current())return;
        await sync({background:true});if(current())await shellOpenChat(d.id,false);return;
      }catch(error){if(current())toast(errMsg(error),'e');}
    }
    if(!current())return;
    const go=n.go;
    if(go&&TABS.some(t=>t[0]===go)){
      A.tab(go);if(UI.tab!==go)return;
      if(n.ref&&go==='seti'){await openContract(n.ref);return;}
      if(n.ref&&go==='jur'){await A.topicopen(n.ref);return;}
      if(n.ref&&go==='news'){await A.nwopen(n.ref);return;}
      if(n.ref&&go==='help'){A.openticket(n.ref);return;}
    }
    await sync({background:true});
  },

  packnorm(){
    readPackDraft();const d=packDraft(),items=packDraftItems(d);
    if(!items.length||items.some(x=>!Number.isFinite(x.weight)||x.weight<=0)){toast('Pondera > 0 necessaria','e');return;}
    if(items.some(i=>!cardById(i.card)||cardById(i.card).active===false)){toast('Cardae inactivae: remove ante servare','e');return;}
    const scale=Math.max(...items.map(x=>x.weight)),sum=items.reduce((s,x)=>s+x.weight/scale,0);
    const normalized=items.map(x=>({card:x.card,weight:(x.weight/scale)/sum*100}));
    // Correct floating residual on the largest weight, never round/clamp small odds.
    const largest=normalized.reduce((a,b)=>a.weight>b.weight?a:b);
    largest.weight+=100-normalized.reduce((s,x)=>s+x.weight,0);
    normalized.forEach(x=>{d.items[x.card]=x.weight;});render({resetForms:true});
  },

/* ---------- events ---------- */
const actionBusy=new Set();
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-a]');
  if(!el)return;
  const key=el.dataset.a,val=el.dataset.v,fn=A[key];
  if(!fn)return;
  ev.preventDefault();
  const token=(ME?.uid||'auth')+'|'+key+'|'+(val||'');
  if(actionBusy.has(token))return;
  actionBusy.add(token);
  const uid=ME?.uid;
  try{
    const result=fn(val,el);
    if(result&&typeof result.then==='function'){
      el.setAttribute('aria-busy','true');
      await result;
    }
  }catch(err){if(!err.cancelled&&ME?.uid===uid)toast(errMsg(err),'e');}
  finally{actionBusy.delete(token);el.removeAttribute('aria-busy');}
});
document.addEventListener('submit',ev=>{
  if(ev.target.closest('.md'))return;
  ev.preventDefault();
});
/* Simplified alphabet never rewrites passwords, URLs, or active IME composition. */
function shellInput(ev){
  const el=ev.target;
  if(!el||(el.tagName!=='INPUT'&&el.tagName!=='TEXTAREA')||el.type==='password')return;
  if(!ev.isComposing&&!el.matches('[type="number"],[type="color"],[type="date"],[type="url"],[type="email"]')&&!/url|image|img|avatar/i.test(el.name+' '+el.id)&&!/:\/\/|data:/.test(el.value)){
    const v=el.value,n=v.replace(/([ASCEJBIU])\//gi,(m,c)=>{const x=MAP[c.toUpperCase()];return c===c.toUpperCase()?x:x.toLowerCase();});
    if(n!==v){const pos=Math.max(0,(el.selectionStart??n.length)-(v.length-n.length));el.value=n;try{el.setSelectionRange(pos,pos);}catch{}}
  }
  if(el.id==='ci'&&ME)shellDraftSave(shellChatKey(),el.value);
}
document.addEventListener('input',shellInput);
document.addEventListener('compositionend',shellInput);
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(!el||el.dataset.a!=='quickset')return;
  ev.preventDefault();
  setQuick(Number(el.dataset.v),el.value);
});
document.addEventListener('keydown',ev=>{
  if(ev.isComposing)return;
  shellDialogs();
  const dialog=SHELL.dialog;
  if(ev.key==='Escape'&&dialog){
    ev.preventDefault();
    if($('#preveal')){if(A.pvclose)A.pvclose();else $('#preveal').remove();}
    else if(UI.modal)closeModal(null);else A.closesh();
    shellDialogs();return;
  }
  if(ev.key==='Tab'&&dialog){
    const list=shellFocusables(dialog),first=list[0],last=list[list.length-1];
    if(!first){ev.preventDefault();dialog.focus();return;}
    if(ev.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){ev.preventDefault();last.focus();}
    else if(!ev.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){ev.preventDefault();first.focus();}
    return;
  }
  const el=ev.target;
  if((ev.key==='Enter'||ev.key===' ')&&el.matches('[data-a][role="button"]')&&!el.matches('button,input,select,textarea')){ev.preventDefault();el.click();return;}
  if(dialog)return;
  const ent={
    sq:()=>A.search(),lawq:()=>A.lawsearch(),bq:()=>A.bsearch(),mkq:()=>A.mksearch(),
    jq:()=>A.jsearch(),chq:()=>A.chsearch(),cardq:()=>A.cardsearch(),pkQ:()=>A.packsearch(),
    betq:()=>A.betsearch(),nwq:()=>A.nwsearch(),rootQ:()=>A.rootsearch(),rpw:()=>A.rootauth(),
    setiq:()=>A.setisearch(),ci:()=>UI.grp?A.sendgrp():A.sendchat()
  };
  if(ev.key==='Enter'&&el&&ent[el.id]){ev.preventDefault();Promise.resolve(ent[el.id]()).catch(error=>toast(errMsg(error),'e'));}
});
function shellFlush(){
  if(SHELL.flushTimer)return;
  SHELL.flushTimer=setTimeout(()=>{SHELL.flushTimer=null;const main=$('#shell-main');if(ME&&SHELL.pending&&main&&!shellEditing(main))render({background:true});},0);
}
document.addEventListener('focusout',shellFlush);
document.addEventListener('selectionchange',shellFlush);
document.addEventListener('pointerdown',ev=>{
  if(ev.target.classList?.contains('sheet'))A.closesh();
  if(ev.target.closest('[data-a]'))shellCapture();
});
document.addEventListener('scroll',ev=>{
  const box=ev.target;
  if(box.id==='cm'&&box.scrollHeight-box.clientHeight-box.scrollTop<64&&SHELL.newMessages){SHELL.newMessages=0;shellChatNotice();}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){
    if(ME)shellCapture();clearInterval(UI._pollTimer);clearInterval(UI._chatTimer);UI._pollTimer=null;UI._chatTimer=null;
  }else if(ME){pollingStart();pollPulse();pollChat();}
});
function shellViewport(){
  const vp=window.visualViewport,h=document.documentElement;
  h.style.setProperty('--shell-vh',(vp?vp.height:window.innerHeight)+'px');
  h.style.setProperty('--shell-vtop',(vp?vp.offsetTop:0)+'px');
  const keyboard=vp&&vp.scale===1?Math.max(0,window.innerHeight-vp.height-vp.offsetTop):0;
  h.style.setProperty('--shell-keyboard',(keyboard>120?keyboard:0)+'px');
  h.dataset.keyboard=keyboard>120?'open':'closed';
}
window.visualViewport?.addEventListener('resize',shellViewport);
window.visualViewport?.addEventListener('scroll',shellViewport);
window.addEventListener('resize',shellViewport);
window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',shellMotion);
new MutationObserver(()=>{
  shellDialogs();
  document.querySelectorAll('[data-a]:not(button):not(input):not(select):not(textarea):not([role])').forEach(el=>{el.setAttribute('role','button');el.tabIndex=0;});
}).observe(document.body,{childList:true,subtree:true});
sb.auth.onAuthStateChange((event,session)=>{
  const uid=session?.user?.id;
  if(event==='SIGNED_OUT'){shellReset();renderAuth();}
  else if(uid&&SHELL.account&&uid!==SHELL.account){shellReset();SHELL.account=uid;queueMicrotask(()=>boot());}
});

/* ---------- download ---------- */
function download(name,text,type){
  const blob=new Blob([text],{type:type||'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
