<!DOCTYPE html>

<head>

<title>Sellprade Appentanskie — Respublica Nationalie</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#080c1b;--c:#141b3a;--c2:#1c254d;--c3:#232e5e;--bd:#2d3a6d;--tx:#e8ecff;--mu:#8b95c9;--p:#6d8bff;--p2:#8b6dff;--ok:#2ecc71;--er:#ff5c7c;--wn:#ffb547;--gd:#ffd166;color-scheme:dark}

body{font:15px/1.55 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(ellipse at 20% -10%,var(--c),var(--bg) 62%) fixed;color:var(--tx);min-height:100vh;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
a{color:var(--p);text-decoration:none}a:hover{text-decoration:underline}
.hryv{display:inline-block;position:relative;font:italic 600 .85em Georgia,serif;line-height:1;margin-left:2px;padding:.06em .06em 0 .03em}
.hryv::before,.hryv::after{content:'';position:absolute;left:.22em;width:.48em;height:.055em;background:currentColor}
.hryv::before{top:.02em}.hryv::after{top:.11em}
header{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px)}
.br{display:flex;align-items:center;gap:10px;min-width:0}.br small{display:block;font-size:.58rem;letter-spacing:1.1px;text-transform:uppercase;color:var(--mu)}.br b{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lg{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0;box-shadow:0 6px 18px rgba(109,139,255,.3)}
.ua{display:flex;gap:6px;align-items:center;min-width:0}.chip{padding:5px 11px;border:1px solid var(--bd);border-radius:20px;background:var(--c);font-size:.76rem;cursor:pointer;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--gd)}
main,.aw{max-width:1120px;margin:0 auto;padding:0 12px 70px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3,.card h2{font-size:.98rem;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.3}
.card h3 .hp,.card h2 .hp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.fl{margin-bottom:11px}.fl label{display:block;font-size:.66rem;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:4px}
input,textarea,select{width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;color:var(--tx);font:inherit;color-scheme:inherit}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;cursor:pointer}

textarea{resize:vertical;min-height:84px}.hint{font-size:.68rem;color:var(--mu);display:block;margin-top:4px}.hint a{cursor:pointer}
.bt{display:inline-flex;gap:6px;align-items:center;justify-content:center;padding:9px 14px;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.1);color:inherit;font:700 .82rem inherit;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.15s}
.bt.p{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0;box-shadow:0 4px 14px rgba(109,139,255,.22)}.bt.g{background:none}.bt.d{background:none;border-color:var(--er);color:var(--er)}.bt.ok{background:rgba(46,204,113,.12);border-color:var(--ok);color:var(--ok)}.bt.sm{padding:5px 9px;font-size:.71rem;border-radius:9px}.bt:disabled{opacity:.4;cursor:not-allowed}.bt:hover:not(:disabled){filter:brightness(1.12)}
.al{padding:10px 13px;border-radius:12px;margin-bottom:11px;font-size:.8rem;border:1px solid var(--wn);color:var(--wn);background:rgba(255,181,71,.1)}.al.e{border-color:var(--er);color:var(--er);background:rgba(255,92,124,.1)}.al.i{border-color:var(--p);color:#aebdff;background:rgba(109,139,255,.1)}.al.s{border-color:var(--ok);color:var(--ok);background:rgba(46,204,113,.1)}
.gs{display:flex;gap:7px;flex-wrap:wrap}.gs .bt{flex:0 1 auto}
.bc{position:relative;background:linear-gradient(135deg,#22307a,#5b35c9 55%,#8b6dff);color:#fff;border-radius:20px;padding:24px;margin-bottom:12px;display:flex;flex-direction:column;gap:7px;align-items:flex-start;overflow:hidden;box-shadow:0 18px 50px rgba(80,50,200,.25)}
.bc::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.09);right:-80px;top:-120px;pointer-events:none}

.pp{position:relative;background:linear-gradient(135deg,#161f4b,#2f2770 58%,#5b35c9);color:#fff;border-radius:20px;padding:20px;margin-bottom:12px;overflow:hidden;box-shadow:0 18px 50px rgba(50,40,140,.22)}
.pp::after{content:'';position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(139,109,255,.28),transparent 68%);right:-90px;bottom:-140px;pointer-events:none}
.pp::before{content:'Ś';position:absolute;right:18px;top:0;font:900 110px/1 Georgia,serif;color:rgba(255,255,255,.045);pointer-events:none}
.pp .pph{display:flex;gap:13px;align-items:center;position:relative;z-index:1}.pp .pph .av{width:56px;height:56px;border-radius:17px;font-size:1.2rem;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24)}
.pp .nm{font-size:1.12rem;font-weight:800;line-height:1.25}.pp .sub{font-size:.73rem;color:rgba(255,255,255,.68)}
.pp .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pp .pfoot{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:11px;border-top:1px solid rgba(255,255,255,.16);font-size:.66rem;color:rgba(255,255,255,.72);position:relative;z-index:1}
.pp .pfoot b{display:block;color:#fff;font-size:.82rem;letter-spacing:.3px}
.av{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0;font-size:.85rem;letter-spacing:.3px}
.av-sm{width:28px;height:28px;border-radius:9px;font-size:.66rem}
.pl{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:.63rem;font-weight:800;letter-spacing:.3px;border:1px solid var(--bd);background:var(--c2);color:var(--mu);white-space:nowrap}
.pl.ok{color:var(--ok);border-color:rgba(46,204,113,.4);background:rgba(46,204,113,.1)}
.pl.wn{color:var(--wn);border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.1)}
.pl.er{color:var(--er);border-color:rgba(255,92,124,.4);background:rgba(255,92,124,.1)}
.pl.ad{color:var(--gd);border-color:rgba(255,209,102,.4);background:rgba(255,209,102,.1)}
.pl.pp2{color:#cfc4ff;border-color:rgba(139,109,255,.4);background:rgba(139,109,255,.16)}
.pp .pl{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.25);color:#fff}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:start}.cols>div{min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}.stack>.card{margin-bottom:0}
.rw{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:.83rem;align-items:center}.rw:last-child{border-bottom:0}.rw span:first-child{color:var(--mu)}.rw b{text-align:right;word-break:break-word}
.it{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;transition:.15s}.it:last-child{margin-bottom:0}
.it .r{display:flex;gap:10px;align-items:center}.it .r[data-a]{cursor:pointer}.it .r[data-a]:hover{opacity:.9}
.it i{font-style:normal;width:34px;height:34px;border-radius:10px;background:var(--c2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1rem}
.it.un{border-color:rgba(109,139,255,.55);background:linear-gradient(90deg,rgba(109,139,255,.1),var(--bg) 60%)}
.in{flex:1;min-width:0}.in b{display:block;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.in small,.mu{color:var(--mu);font-size:.71rem}
.dt{margin-top:8px;padding:9px 11px;background:var(--c2);border-radius:9px;font-size:.79rem;white-space:pre-wrap;word-break:break-word}.it .bt{margin:8px 6px 0 0}
.gn{color:var(--ok)}.rd{color:var(--er)}.em{text-align:center;color:var(--mu);padding:24px;font-size:.84rem}.em .ic{display:block;font-size:1.7rem;margin-bottom:6px;opacity:.7}
.cm{height:50vh;min-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--bg);border-radius:12px;margin-bottom:10px;scroll-behavior:smooth}
.ms{max-width:80%;padding:8px 12px;border-radius:14px;font-size:.84rem;word-break:break-word;white-space:pre-wrap}.ms small{display:block;font-size:.6rem;opacity:.7;margin-top:2px}
.ms.s{align-self:flex-end;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-bottom-right-radius:4px}.ms.o{align-self:flex-start;background:var(--c2);border:1px solid var(--bd);border-bottom-left-radius:4px}
.sr{display:flex;gap:7px;margin-top:8px}.sr input{flex:1}.sr .bt{padding:0 14px}
.ts{overflow:auto;border:1px solid var(--bd);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:.76rem}th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{background:var(--c2);color:var(--mu);font-size:.64rem;text-transform:uppercase}tr:last-child td{border-bottom:0}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin-bottom:12px}.gr div{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:11px;font-size:.63rem;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}.gr b{display:block;font-size:1.05rem;color:var(--tx);margin-top:2px;text-transform:none;letter-spacing:0;word-break:break-word}
.sw{width:44px;height:24px;border-radius:12px;border:0;background:var(--bd);position:relative;cursor:pointer;flex-shrink:0}.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s}.sw.on{background:linear-gradient(135deg,var(--p),var(--p2))}.sw.on::after{transform:translateX(20px)}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.tb .srch{flex:1;min-width:140px;padding:8px 12px;font-size:.82rem}
.filters{display:flex;gap:6px;flex-wrap:wrap}.fchip{padding:6px 10px;border-radius:20px;border:1px solid var(--bd);background:var(--c);font-size:.71rem;font-weight:700;cursor:pointer;color:var(--mu);white-space:nowrap}

.quote{padding:9px 11px;border-left:3px solid var(--p);background:var(--c2);border-radius:0 9px 9px 0;font-size:.76rem;color:var(--mu);margin-bottom:8px;overflow-wrap:anywhere}
.tg{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--c2);border:1px solid var(--bd);font-size:.59rem;font-weight:800;color:var(--mu);letter-spacing:.4px;text-transform:uppercase}
.tg.pin{color:var(--gd);border-color:rgba(255,209,102,.35)}.tg.lock{color:var(--er);border-color:rgba(255,92,124,.35)}.tg.ok{color:var(--ok);border-color:rgba(46,204,113,.35)}
.like{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);background:none;color:var(--mu);border-radius:20px;padding:4px 10px;font:700 .7rem inherit;font-family:inherit;cursor:pointer}.like.on{color:var(--er);border-color:rgba(255,92,124,.4);background:rgba(255,92,124,.1)}
.mb{position:fixed;inset:0;z-index:100;background:rgba(4,7,18,.84);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.md{background:var(--c);border:1px solid var(--bd);border-radius:20px;padding:20px;width:100%;max-width:480px;max-height:96vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.45)}.md h3{margin-bottom:10px}.mbd{margin-bottom:12px;font-size:.84rem}.ft{display:flex;gap:9px;justify-content:flex-end;margin-top:13px;flex-wrap:wrap}

.gate{max-width:430px;margin:5vh auto}.gate .lg{margin:0 auto 14px;width:54px;height:54px;border-radius:16px;font-size:28px}
.logline{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:.75rem}.logline:last-child{border-bottom:0}.logline time{color:var(--mu);white-space:nowrap;font-size:.67rem}.logline b{color:var(--p)}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px}
.foot{text-align:center;color:var(--mu);font-size:.62rem;padding:16px 0 4px;letter-spacing:.3px;line-height:1.7}
.kbd{font:700 .67rem ui-monospace,monospace;padding:2px 6px;border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;background:var(--c2)}

:root{
  --bg:#070a13;--bg2:#0a0f1d;--c:#0f1627;--c2:#141d33;--c3:#1a2440;
  --bd:rgba(255,255,255,.075);--bd2:rgba(255,255,255,.145);

  --r:18px;
  --sh1:inset 0 1px 0 rgba(255,255,255,.05),0 14px 34px -26px rgba(0,0,0,.9);
  --sh2:0 32px 80px -32px rgba(0,0,0,.92);
  --p:#8aa4ff;--p2:#b07bff;--glow:rgba(138,164,255,.36);
  --grad:linear-gradient(135deg,var(--p),var(--p2));
  color-scheme:dark;
}
html[data-accent=emerald]{--p:#3ee0a0;--p2:#22d3ee;--glow:rgba(62,224,160,.32)}

html[data-theme=light]{
  --bg:#f4f6fc;--bg2:#eaedf7;--c:#ffffff;--c2:#f5f7fe;--c3:#e9edfa;
  --bd:rgba(20,30,65,.09);--bd2:rgba(20,30,65,.17);
  --tx:#141a2e;--mu:#68728e;
  --gd:#a97b24;
  --sh1:inset 0 1px 0 rgba(255,255,255,.9),0 16px 36px -28px rgba(20,30,70,.55);
  --sh2:0 34px 80px -34px rgba(20,30,70,.45);
  --p:#3b57d8;--p2:#7c3aed;--glow:rgba(59,87,216,.22);

html[data-theme=light][data-accent=sunset]{--p:#b45309;--p2:#b91c1c;--glow:rgba(180,83,9,.22)}

body{
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:
    radial-gradient(1100px 720px at 88% -10%,color-mix(in srgb,var(--p) 13%,transparent),transparent 62%),
    radial-gradient(900px 620px at -12% 14%,color-mix(in srgb,var(--p2) 10%,transparent),transparent 58%),
    linear-gradient(180deg,var(--bg),var(--bg2) 72%,var(--bg));

}

}

.bt:hover:not(:disabled){transform:translateY(-1px);border-color:var(--bd2);filter:none}

.foot{opacity:.75;letter-spacing:.2px}
.hint{opacity:.92}

/* settings: mode + accent picker */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--bd);font-size:.82rem}
.setrow:last-child{border-bottom:0}
.setrow>span:first-child{color:var(--mu)}
.seg{display:inline-flex;gap:3px;padding:3px;background:color-mix(in srgb,var(--bg) 70%,var(--c));border:1px solid var(--bd);border-radius:12px}

.acc{position:relative;width:27px;height:27px;border-radius:50%;border:2px solid transparent;background:linear-gradient(135deg,var(--a1),var(--a2));cursor:pointer;box-shadow:0 5px 12px -6px rgba(0,0,0,.55);transition:transform .16s,border-color .16s}
.acc:hover{transform:scale(1.07)}

:root{--onacc:#0a0e1a}

body{-webkit-tap-highlight-color:transparent}
.bt.p,.tab.on,.sbt.on,.fchip.on,.segbtn.on,.bnav button.on,.ms.s{color:var(--onacc)}

.it .r[data-a]{transition:opacity .15s,background .15s;border-radius:10px}

.rw b,.gr b,.banner .amt,.bc .big{font-variant-numeric:tabular-nums}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--p) 28%,var(--bd)) transparent}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--p) 30%,var(--bd));border-radius:99px}
:focus-visible{outline:2px solid color-mix(in srgb,var(--p) 70%,transparent);outline-offset:2px}
@media(hover:none){
  .bt:hover:not(:disabled){transform:none;filter:none}
  .acc:hover{transform:none}
  .it .r[data-a]:hover{background:none}
}

/* motion */
@keyframes screenIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.995)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.975)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{transform:translateY(36px);opacity:.6}to{transform:none;opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes likePop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
main.enter{animation:screenIn .32s cubic-bezier(.22,.8,.24,1) both}
main.enter .card{animation:cardIn .42s cubic-bezier(.22,.8,.24,1) both}
main.enter .card:nth-of-type(2){animation-delay:.04s}
main.enter .card:nth-of-type(3){animation-delay:.08s}
main.enter .card:nth-of-type(4){animation-delay:.12s}
.like.on{animation:likePop .32s ease-out}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

function closeModal(value){

function ask(title,fields=[],submit='Confirma',note='',validate=null){
  return new Promise(resolve=>{
    UI.modal={title,fields,submit,note,validate,resolve};

}
function drawModal(){
  const m=UI.modal;if(!m)return;
  let host=document.getElementById('modal');
  if(!host){host=document.createElement('div');host.id='modal';document.body.appendChild(host);}
  const body=m.fields.map(f=>{
    const id='mf-'+f.n;
    let inp;
    if(f.type==='ta')inp=`<textarea id="${id}" maxlength="${f.max||800}" placeholder="${esc(f.ph||'')}">${esc(f.value||'')}</textarea>`;
    else if(f.type==='sel'){
      inp=`<select id="${id}">`+(f.opts||[]).map(o=>`<option value="${esc(o.v)}"${String(o.v)===String(f.value)?' selected':''}>${esc(o.l)}</option>`).join('')+`</select>`;
    }else{
      inp=`<input id="${id}" type="${f.type==='num'?'number':f.type==='pass'?'password':'text'}"${f.type==='num'?' step="0.01" min="0"':''} maxlength="${f.max||120}" value="${esc(f.value==null?'':f.value)}" placeholder="${esc(f.ph||'')}">`;
    }
    return `<div class="fl"><label>${esc(f.label||f.n)}</label>${inp}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;
  }).join('');
  host.innerHTML=`<div class="mb"><form class="md" autocomplete="off">
    <h3>${esc(m.title)}</h3>
    ${m.note?`<div class="mbd mut">${esc(m.note)}</div>`:''}
    ${body}
    <div class="authmsg" id="merr"></div>
    <div class="ft"><button type="button" class="bt g" data-a="modalcancel">Claude</button>
    <button type="submit" class="bt p">${esc(m.submit)}</button></div>
  </form></div>`;
  const form=host.querySelector('form');
  form.onsubmit=ev=>{ev.preventDefault();submitModal();};
  trDom(host);
}

function trCore(t){return UKD[t]!=null?UKD[t]:null;}
function trText(s){
  if(UI.lang!=='uk'||!s)return s;
  const lead=s.slice(0,s.length-s.trimStart().length),trail=s.slice(s.trimEnd().length);
  const t=s.trim();if(!t)return s;
  let rep=trCore(t);
  if(rep==null){
    const m=t.match(/^([^\p{L}\p{N}]+)(.+)$/u);
    if(m){const inner=trCore(m[2].trim());if(inner!=null)rep=m[1]+inner;}
  }
  return rep==null?s:lead+rep+trail;
}
function trDom(root){
  if(UI.lang!=='uk'||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];
  while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const v=trText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;});
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
    ['placeholder','title','aria-label'].forEach(a=>{const s=el.getAttribute(a);if(s){const v=trText(s);if(v!==s)el.setAttribute(a,v);}});
  });
}

/* ---------- auth / sync ---------- */
async function boot(){
  try{
    const {data}=await sb.auth.getSession();
    if(data&&data.session){
      try{await sync();}catch(err){await sb.auth.signOut();renderAuth(errMsg(err));}
    }else renderAuth();
  }catch(err){renderAuth(errMsg(err));}
}
async function sync(){
  const {data,error}=await sb.rpc('api_sync');
  if(error){
    if(/Exsul/.test(error.message)){DB=null;ME=null;renderBlocked();return;}
    if(/Aditus necessarius|Profil non inventus/.test(error.message)){
      DB=null;ME=null;await sb.auth.signOut();renderAuth(errMsg(error));return;
    }
    throw error;
  }
  DB=data;ME=data.me;
  if(UI.tab==='root'&&!ME.admin)UI.tab='holb';
  const nu=unread()+unreadChats();
  if(UI._unread&&nu>UI._unread)beep();
  UI._unread=nu;
  render();
}
async function rpc(name,args){
  const {data,error}=await sb.rpc(name,args||{});
  if(error)throw error;
  return data;
}
async function run(fn,ok){
  try{const r=await fn();await sync();if(ok)toast(ok,'s');return r;}
  catch(err){toast(errMsg(err),'e');return null;}
}

function bank(){
  const sub=UI.bsub||'ledger';
  const tabs=[['ledger','Motti'],['req','Petitiones'],['esc','Sequester'],['book','Liber Fisci']];
  const me=ME.nick,mine=DB.ledger||[];
  const inn=mine.filter(l=>l.dst===me).reduce((s,l)=>s+(+l.net||0),0);
  const out=mine.filter(l=>l.src===me).reduce((s,l)=>s+(+l.amount||0),0);

      ${statBox('Introitus',UI.hide?'••••':fm(inn)+' h')}
      ${statBox('Exitus',UI.hide?'••••':fm(out)+' h')}
      ${statBox('Portorium',UI.hide?'••••':fm(fee)+' h')}

    ${bankBody(sub)}`;
}
function bankBody(sub){
  const me=ME.nick;
  if(sub==='ledger'){
    const q=(UI.bQ||'').trim().toLowerCase();
    const list=(DB.ledger||[]).filter(l=>{
      if(UI.bF==='in'&&l.dst!==me)return false;
      if(UI.bF==='out'&&l.src!==me)return false;
      if(UI.bF==='mint'&&!['cude','ure','burn','stipendium','multa','refund'].includes(l.kind))return false;
      if(q&&!((l.note||'')+' '+(l.src||'')+' '+(l.dst||'')+' '+l.kind).toLowerCase().includes(q))return false;
      return true;
    });
    return `<div class="tb"><div class="filters">${[['all','Omnia'],['in','Introitus'],['out','Exitus'],['mint','Cusio']].map(([id,l])=>`<button class="fchip ${UI.bF===id?'on':''}" data-a="bfilter" data-v="${id}">${l}</button>`).join('')}</div>
      <button class="bt g sm" data-a="bcsv">⬇ CSV</button></div>
      <div class="tb"><input class="srch" id="bq" maxlength="60" value="${esc(UI.bQ||'')}" placeholder="Quaere: nota, contrahens…"><button class="bt p sm" data-a="bsearch">Quaere</button></div>
      ${C('Motti',ledgerRows(list,true))}`;
  }
  if(sub==='book')return C('Liber Fisci',ledgerRows(DB.book||[],false));
  if(sub==='req'){
    const rs=DB.requests||[];
    return `${C('Introitus',rs.filter(r=>r.to===me&&r.status==='open').map(reqRow).join('')||e('Petitiones desunt','📥'))}
      ${C('Misae',rs.filter(r=>r.from===me&&r.status==='open').map(reqRow).join('')||e('Petitiones desunt','📤'))}
      ${C('Historia',rs.filter(r=>r.status!=='open').map(reqRow).join('')||e('Historia vacua','🗂'))}`;
  }
  const es=DB.escrows||[];
  return C('Sequester',(es.map(x=>{
      let act='';
      if(x.status==='held'||x.status==='delivered'){
        if(x.payee===ME.nick&&x.status==='held')act+=bt('Trada','escdeliver',x.id,'ok sm');
        if(x.payer===ME.nick&&(x.status==='held'||x.status==='delivered'))act+=bt('Libera','escrelease',x.id,'p sm');
        if(x.payer===ME.nick&&x.status==='held')act+=bt('Abroga','esccancel',x.id,'d sm');
      }
      return `<div class="it"><div class="r"><i>🔐</i><div class="in"><b>@${esc(x.payer)} → @${esc(x.payee)} · ${fm(x.amount)} h</b><small>${dt(x.ts)} · ${esc(x.status)} · ${esc(x.note)}</small></div></div>${act?`<div class="gs" style="margin-top:8px">${act}</div>`:''}</div>`;
    }).join('')||e('Sequester nullus','🔐')));
}

function pollHtml(t){
  const p=t.poll;if(!p)return'';
  const total=(p.opts||[]).reduce((s,o)=>s+(o.v||[]).length,0);
  const my=p.my;
  return `<div class="quote">📊 ${esc(p.q)} · ${total} vota${my!=null?' · votum tuum':' · elige unum'}</div>`+
    (p.opts||[]).map((o,i)=>{
      const pc=total?Math.round((o.v||[]).length*100/total):0;
      const can=my==null&&!t.locked;
      return `<div class="pollopt ${my===i?'on':''}"${can?` data-a="pollvote" data-v="${t.id}:${i}"`:''}><span class="pbar" style="width:${pc}%"></span><span class="pv"><span>${esc(o.t)}</span><span>${(o.v||[]).length} · ${pc}%</span></span></div>`;
    }).join('');
}

function quaere(){
  const q=(UI.q||'').trim().toLowerCase();
  const body=`<div class="tb"><input class="srch" id="q" maxlength="60" value="${esc(UI.q||'')}" placeholder="Quaere cives, temata, lots, acta, sodalitates…"><button class="bt p" data-a="search">Quaere</button></div>`;
  if(q.length<2)return body+`<div class="mut" style="padding:2px 2px 6px">Minimum 2 signa</div>`;
  const has=(...a)=>a.join(' ').toLowerCase().includes(q);
  const us=users().filter(u=>has(u.nick,u.name,u.sur,u.roy,u.id)).slice(0,8);
  const ts=myTopics().filter(t=>has(t.title,t.body,t.by)).slice(0,6);
  const ls=myLots().filter(l=>has(l.title,l.body,l.seller)).slice(0,6);
  const ns=myNews().filter(n=>has(n.title,n.body,n.by)).slice(0,6);
  const js=myJobs().filter(j=>has(j.title,j.body,j.by)).slice(0,6);
  const cs=myCompanies().filter(c=>has(c.name,c.about,c.owner,c.cat)).slice(0,6);
  const laws=myLaws().filter(l=>has(l.title,l.body,l.by)).slice(0,5);
  const secs=[];
  if(us.length)secs.push(C('Cives',us.map(u=>`<div class="it"><div class="r" data-a="prof" data-v="${esc(u.nick)}">${ava(u,'av-sm')}<div class="in"><b>${esc(u.name)} ${esc(u.sur)}</b><small>@${esc(u.nick)} · ${esc(u.roy)} · ${esc(u.id)}</small></div>${plTag(u)}</div></div>`).join('')));
  if(ts.length)secs.push(C('Temata',ts.map(t=>`<div class="it"><div class="r" data-a="topicopen" data-v="${t.id}"><i>🗣</i><div class="in"><b>${esc(t.title)}</b><small>@${esc(t.by)} · ${(t.posts||[]).length} responsa · ${dt(t.ts)}</small></div></div></div>`).join('')));
  if(ls.length)secs.push(C('Lots',ls.map(l=>`<div class="it"><div class="r" data-a="tab" data-v="prad"><i>${l.kind==='auction'?'🔨':'🛒'}</i><div class="in"><b>${esc(l.title)}</b><small>${fm(l.price)} h · @${esc(l.seller)} · ${esc(l.cat)}</small></div></div></div>`).join('')));
  if(ns.length)secs.push(C('Acta',ns.map(n=>`<div class="it"><div class="r" data-a="nwopen" data-v="${n.id}"><i>📰</i><div class="in"><b>${esc(n.title)}</b><small>@${esc(n.by)} · ${dt(n.ts)}</small></div></div></div>`).join('')));
  if(js.length)secs.push(C('Opera',js.map(j=>`<div class="it"><div class="r" data-a="tab" data-v="labor"><i>🛠</i><div class="in"><b>${esc(j.title)}</b><small>${fm(j.pay)} h · ${esc(j.status)} · ${dt(j.ts)}</small></div></div></div>`).join('')));
  if(cs.length)secs.push(C('Sodalitates',cs.map(c=>`<div class="it"><div class="r" data-a="tab" data-v="caten"><i>🏛</i><div class="in"><b>${esc(c.name)}</b><small>@${esc(c.owner)} · ${esc(c.cat)} · ${c.members.length+1} membra</small></div></div></div>`).join('')));
  if(laws.length)secs.push(C('Leges',laws.map(l=>`<div class="it"><div class="r" data-a="tab" data-v="vlada"><i>⚖</i><div class="in"><b>${esc(l.title)}</b><small>@${esc(l.by)} · ${esc(l.status)}</small></div></div></div>`).join('')));
  return body+(secs.join('')||C('Quaere',e('Nihil inventum','🔎')));
}

    const nick=($('#a-nick')?.value||'').trim();

    const e1=vNick(nick);if(e1){authErrBox(e1);return;}

    authErrBox('');
    const email=emailFor(nick);
    try{
      if(reg){
        const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{nick,name,sur}}});
        if(error)throw error;
        if(!data.session)throw new Error('Confirma email in Supabase aut disactiva “Confirm email”.');

    const f=await ask('Mutus',[{n:'m',label:'Minuta',type:'sel',opts:[{v:'0',l:'Nullus'},{v:'60',l:'1 h'},{v:'1440',l:'24 h'},{v:'10080',l:'7 dies'}]}],'Serva','');
    if(!f)return;
    await run(()=>rpc('api_admin_mute',{p_target:uid,p_minutes:+f.m}),'Mutus mutatus');
  },
  async adminmint(uid){
    const u=pickUser(uid);if(!u)return;
    const f=await ask('✨ Cudere / Urere',[
      {n:'dir',label:'Directio',type:'sel',opts:[{v:'mint',l:'Cudere (addere)'},{v:'burn',l:'Urere (auferre)'}]},
      {n:'amount',label:'Summa (h)',type:'num'},
      {n:'note',label:'Nota',max:200}
    ],'Exsequere','',v=>!(+v.amount>0)?'Summa > 0 necessaria':'');
    if(!f)return;
    await run(()=>rpc('api_admin_mint',{p_nick:u.nick,p_amount:+f.amount,p_direction:f.dir,p_note:f.note.trim()}),'Factum');
  },
  async admindel(uid){
    const u=pickUser(uid);if(!u)return;
    if(!await ask('🗑 Dele civem?',[],'Dele',`@${u.nick} (${u.id}) et omnia eius. Aerarium eius in Fiscum ibit.`))return;
    await run(()=>rpc('api_admin_delete_user',{p_target:uid}),'Civis deletus');
  },
  async broadcast(){
    const f=await ask('📣 Nuntius universis',[{n:'text',label:'Textus',type:'ta',max:300}],'Mitte','Omnes cives accipient.',v=>v.text.trim().length<3?'Textus: minimum 3 signa':'');
    if(!f)return;
    await run(()=>rpc('api_admin_broadcast',{p_text:f.text.trim()}),'Nuntius missus');
  },
  async exportdb(){
    try{
      const d=await rpc('api_admin_export');
      download('sellprade_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(d,null,1));
      toast('Reservum missum','s');
    }catch(e){toast(errMsg(e),'e');}
  },
  async rpdismiss(id){await run(()=>rpc('api_report_dismiss',{p_report:id}),'Delatio dimissa');},
  async rpmute(v){
    const [id,m]=String(v).split(':');
    if(!await ask('Mutus civis?',[],'Mute',m+' min'))return;
    await run(()=>rpc('api_report_mute',{p_report:id,p_minutes:+m}),'Mutus datus');
  },
  async rpblock(id){
    if(!await ask('Exsilia civem?',[],'Exsilia'))return;
    await run(()=>rpc('api_report_block',{p_report:id}),'Exsilium datum');
  }
};

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-a]');
  if(!el)return;
  const key=el.dataset.a;
  const val=el.dataset.v;
  const fn=A[key];
  if(!fn)return;
  ev.preventDefault();
  try{
    if(key==='newchat'&&val){await A.newchat(val);return;}
    await fn(val,el);
  }catch(err){toast(errMsg(err),'e');}
});
document.addEventListener('submit',ev=>{
  if(ev.target.closest('.md'))return;
  ev.preventDefault();
});
/* simplified input: A/ → Á, s/ → ś, etc. Applies to every text field. */
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(!el||(el.tagName!=='INPUT'&&el.tagName!=='TEXTAREA'))return;
  if(el.type==='password'||el.type==='number')return;
  const v=el.value;
  if(v.indexOf('/')<0)return;
  const n=v.replace(/([ASCEJBIU])\//gi,(m,c)=>{
    const x=MAP[c.toUpperCase()];
    return c===c.toUpperCase()?x:x.toLowerCase();
  });
  if(n===v)return;
  const pos=Math.max(0,(el.selectionStart??n.length)-(v.length-n.length));
  el.value=n;
  try{el.setSelectionRange(pos,pos);}catch{}
});
document.addEventListener('keydown',ev=>{
  const ent={q:()=>A.search(),bq:()=>A.bsearch(),mkq:()=>A.mksearch(),jq:()=>A.jsearch(),chq:()=>A.chsearch(),rootQ:()=>A.rootsearch(),rpw:()=>A.rootauth()};
  if(ev.key==='Enter'&&ev.target&&ent[ev.target.id]){ev.preventDefault();ent[ev.target.id]();}
  if(ev.key==='Escape'&&UI.modal)closeModal(null);
});
window.addEventListener('online',()=>{if(ME)sync().catch(()=>{});});

/* ---------- download ---------- */
function download(name,text,type){
  const blob=new Blob([text],{type:type||'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------- boot ---------- */
boot();
